<script>
(() => {
  // The connector tools this page calls. Keep in step with the `mcp` capabilities in SKILL.md
  // (build.test.mjs checks they match).
  const CONNECTORS = {
    github: { server: "github", tools: ["list_issues", "list_pull_requests", "pull_request_read", "get_file_contents", "issue_read", "issue_write", "actions_run_trigger", "actions_list"] },
    remote: { server: "Claude Code Remote", tools: ["list_repos", "list_environments", "create_session"] },
  };
  const GH = CONNECTORS.github.server;
  const REMOTE = CONNECTORS.remote.server;

  // Codes that mean the viewer has to act before a connector answers.
  const DENIED = new Set(["needs_reauth", "server_not_connected", "selection_required", "server_not_found", "not_in_manifest", "blocked_by_policy", "approval_required", "not_granted", "capability_disabled", "capability_removed", "consent_required"]);
  // Of those, the ones that refuse one tool for this page rather than the whole connector.
  // On get_file_contents they turn off Add repo and discovery, not the page.
  const TOOL_REFUSED = new Set(["not_in_manifest", "blocked_by_policy", "approval_required", "consent_required"]);

  const $ = (id) => document.getElementById(id);
  const state = { mcp: null, tools: { github: new Set(), remote: new Set() }, fileReads: null };

  async function use(name) {
    try { return window.claude?.use ? await window.claude.use(name) : null; } catch { return null; }
  }

  // The full-page state when GitHub can't be read: everything on the page hangs on it.
  // It drops the connector, so Refresh (and Open Permissions) go back through boot().
  function showConnector(code) {
    stopAll();
    state.mcp = null;
    const [title, text] = {
      needs_reauth: ["Reconnect GitHub", "Your GitHub connector needs signing in again. Reconnect it in claude.ai Settings → Connectors, then refresh."],
      blocked_by_policy: ["GitHub is blocked", "Your organization's policy blocks the GitHub connector tools this page reads. Ask an admin to allow them."],
      not_in_manifest: ["Allow GitHub", "This page reads your specs and PRs through the GitHub connector, which isn't allowed for this page. Turn it on in Permissions."],
      approval_required: ["Allow GitHub", "This page reads your specs and PRs through the GitHub connector. Allow it in Permissions."],
    }[code] ?? ["Connect GitHub", "This page reads your specs and PRs through the GitHub connector. Add it in claude.ai Settings → Connectors, or allow it for this page in Permissions."];
    $("connector-title").textContent = title;
    $("connector-text").textContent = text;
    $("connector").hidden = false;
    $("app").hidden = true;
    $("status").textContent = "Not connected to GitHub";
  }
  const connectorShowing = () => !$("connector").hidden;

  $("permissions").addEventListener("click", async () => {
    const permissions = await use("permissions");
    $("permissions-hint").hidden = true;
    try {
      if (!permissions) throw new Error("unavailable");
      await permissions.manage();
      boot();
    } catch {
      $("permissions-hint").hidden = false;
    }
  });

  // Resolves null when GitHub is usable, else the code to explain.
  async function connect() {
    const mcp = await use("mcp");
    if (!mcp) return "server_not_connected";
    let listed;
    try { listed = await mcp.listTools(); } catch (e) { return e?.code ?? "server_not_connected"; }
    const find = (name) => listed.servers.find((s) => s.server.toLowerCase() === name.toLowerCase());
    for (const [key, c] of Object.entries(CONNECTORS)) {
      const entry = find(c.server);
      state.tools[key] = new Set(entry && entry.authStatus !== "needs_reauth" ? entry.tools.map((t) => t.name) : []);
    }
    if (find(GH)?.authStatus === "needs_reauth") return "needs_reauth";
    if (!state.tools.github.has("list_issues") || !state.tools.github.has("list_pull_requests")) return "server_not_connected";
    state.mcp = mcp;
    return null;
  }

  // Per-viewer browser storage. It can throw or come back empty: the page works without it.
  // Browser storage when the page has it; a copy in memory always, so a page without storage
  // (private window, blocked site data) still keeps what it found for as long as it's open.
  const memory = new Map();
  const store = {
    get(key, fallback) {
      try {
        const saved = JSON.parse(localStorage.getItem(`ship-dashboard:${key}`));
        if (saved != null) return saved;
      } catch {}
      return memory.has(key) ? memory.get(key) : fallback;
    },
    set(key, value) {
      memory.set(key, value);
      try { localStorage.setItem(`ship-dashboard:${key}`, JSON.stringify(value)); } catch {}
    },
  };

  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    }
    node.append(...kids.filter((k) => k != null));
    return node;
  };
  const note = (text, error = false) => { $("note").textContent = text; $("note").classList.toggle("error", error); };
  const splitRepo = (full) => { const [owner, repo] = full.split("/"); return { owner, repo }; };
  const codeOf = (e) => e?.code ?? "upstream_error";
  const since = (t) => (Date.now() - t < 60e3 ? "just now" : `${ago(Date.now() - t)} ago`);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---- One-shot reads: one shared pool of six, so a page of projects never floods the connector.
  // Low-priority jobs (comment reads, for the morning-page link) start only when no other job is
  // waiting, and hold at most lowMax of the slots, so they never hold up the lists and check reads
  // the cards depend on.

  function pool(size, lowMax) {
    const queue = [];
    const low = [];
    let active = 0;
    let lowActive = 0;
    const start = ({ job, resolve, reject }, isLow) => {
      active += 1;
      if (isLow) lowActive += 1;
      Promise.resolve().then(job).then(resolve, reject).finally(() => { active -= 1; if (isLow) lowActive -= 1; next(); });
    };
    const next = () => {
      while (active < size && queue.length) start(queue.shift(), false);
      while (active < size && lowActive < lowMax && low.length) start(low.shift(), true);
    };
    return (job, isLow = false) => new Promise((resolve, reject) => { (isLow ? low : queue).push({ job, resolve, reject }); next(); });
  }
  const inPool = pool(6, 2);

  const READ_CACHE = { staleTime: 4 * 60e3, gcTime: 10 * 60e3 };
  // A read through the pool (GitHub unless another server is named). A rate_limited (or otherwise
  // retryable) refusal is retried once, after the wait it asks for; anything else rejects with its code.
  async function readOnce(tool, input, { refresh = false, cache = READ_CACHE, server = GH, low = false } = {}) {
    const options = { cache: cache && refresh ? { ...cache, refresh: true } : cache };
    const call = () => inPool(() => (state.mcp ? state.mcp.callTool(server, tool, input, options) : Promise.reject({ code: "cancelled", message: "" })), low);
    try {
      return await call();
    } catch (e) {
      if (!(e?.code === "rate_limited" || e?.retryable)) throw e;
      await sleep(e.retryAfterMs ?? 2000 + Math.random() * 2000);
      return call();
    }
  }

  // ---- Projects: discovered (cached with its scan time) plus the ones added by name.

  const SCAN_LIMIT = 100;
  const projects = () => mergeProjects(store.get("found", null)?.repos ?? [], store.get("added", []));

  // true when the repo has docs/agents/shipping.md on its default branch (no ref reads that branch),
  // false when GitHub says there's no such file or repo. Rejects with the code otherwise.
  async function hasShipping(full) {
    try {
      await readOnce("get_file_contents", { ...splitRepo(full), path: "docs/agents/shipping.md" }, { cache: false });
      return true;
    } catch (e) {
      if (isMissingFile(e)) return false;
      throw e;
    }
  }

  const fileReadsOk = () => state.tools.github.has("get_file_contents") && !state.fileReads;
  const canDiscover = () => state.tools.remote.has("list_repos") && fileReadsOk();

  // get_file_contents refused for this page: the board still works, adding and finding repos don't.
  function refuseFileReads(code) {
    state.fileReads = code;
    syncToolbar();
  }

  function syncToolbar() {
    $("addrepo").hidden = !fileReadsOk();
    $("rescan").hidden = !canDiscover();
    if (state.fileReads) {
      note(`GitHub won't let this page read files (${state.fileReads}), so repos can't be added or found. Allow the GitHub connector's file reads for this page in Permissions, then Refresh.`, true);
    } else if (!state.tools.github.has("get_file_contents")) {
      note("Your GitHub connector has no file reads, so repos can't be added or found.", true);
    }
  }

  // A failed get_file_contents: a tool refusal turns off adding; a connector denial takes the page.
  // Returns true when it handled the error.
  function fileReadRefused(e) {
    const code = codeOf(e);
    if (TOOL_REFUSED.has(code)) { refuseFileReads(code); return true; }
    if (DENIED.has(code)) { showConnector(code); return true; }
    return false;
  }

  // Rejects only when GitHub refuses (the caller decides between Add repo off and the connector state).
  async function discover() {
    $("rescan").disabled = true;
    try {
      note("Looking for your repos…");
      let repos;
      try {
        const result = await state.mcp.callTool(REMOTE, "list_repos", { limit: SCAN_LIMIT }, { cache: false });
        repos = (result.payload?.repos ?? []).map((r) => r?.full_name).filter((n) => n && normaliseRepo(n) === n).slice(0, SCAN_LIMIT);
      } catch (e) {
        return note(`Claude Code Remote couldn't list your repos (${codeOf(e)}). Add repos by name, or try Rescan.`, true);
      }
      const found = new Set();
      // Only GitHub saying the file is missing drops a project found before; a failed check keeps it.
      const before = new Set(store.get("found", null)?.repos ?? []);
      let done = 0;
      let unchecked = 0;
      let refused = null;
      const queue = [...repos];
      const worker = async () => {
        for (let full; !refused && (full = queue.shift()); ) {
          try {
            if (await hasShipping(full)) found.add(full);
          } catch (e) {
            if (DENIED.has(codeOf(e))) { refused ??= e; return; }
            unchecked += 1; // a transient failure on one repo: keep it if it was found before, and say so
            if (before.has(full)) found.add(full);
          }
          note(`Checking ${++done} of ${repos.length} repos for docs/agents/shipping.md…`);
        }
      };
      await Promise.all(Array.from({ length: 6 }, worker));
      if (refused) throw refused;
      const ordered = repos.filter((r) => found.has(r)); // most recently pushed first
      store.set("found", { repos: ordered, scannedAt: Date.now() });
      const missed = unchecked ? ` ${unchecked} ${unchecked === 1 ? "repo" : "repos"} couldn't be checked: Rescan to try again.` : "";
      note(`Scanned your ${repos.length} most recently pushed repos just now: ${ordered.length} set up for ship.${missed}`, Boolean(unchecked));
    } finally {
      $("rescan").disabled = false;
    }
  }

  async function runDiscover() {
    try { await discover(); } catch (e) { if (!fileReadRefused(e)) note(`Couldn't scan your repos (${codeOf(e)}). Try Rescan.`, true); }
    if (state.mcp) render();
  }

  function scanNote() {
    if (state.fileReads || !state.tools.github.has("get_file_contents")) return syncToolbar();
    if (!state.tools.remote.has("list_repos")) return note("Claude Code Remote isn't connected, so projects are added by name.");
    const found = store.get("found", null);
    if (found?.scannedAt) note(`Last scanned ${since(found.scannedAt)}. Rescan to find repos newly set up for ship.`);
  }

  $("rescan").addEventListener("click", () => runDiscover());

  $("addrepo").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = $("addrepo-name");
    const full = normaliseRepo(input.value);
    if (!full) return note("Type the repo as owner/name, for example acme/app.", true);
    if (projects().some((p) => p.toLowerCase() === full.toLowerCase())) return note(`${full} is already on the dashboard.`);
    $("addrepo-go").disabled = true;
    note(`Checking ${full} for docs/agents/shipping.md…`);
    try {
      if (!(await hasShipping(full))) return note(`${full} isn't set up for ship: it has no docs/agents/shipping.md on its default branch, or GitHub can't find it. Run /ship:setup-ship in it first.`, true);
      store.set("added", mergeProjects(store.get("added", []), [full]));
      input.value = "";
      note(`Added ${full}.`);
      render();
    } catch (e) {
      if (!fileReadRefused(e)) note(`Couldn't check ${full} (${codeOf(e)}). Try again.`, true);
    } finally {
      $("addrepo-go").disabled = false;
    }
  });

  // ---- Loading: four reads per project. The first projects watch them; past the watch budget,
  // projects read once and are re-read by one page-level timer. Either way they look the same.

  const REFETCH = 5 * 60e3;
  const DAY = 24 * 3600e3;
  // The runtime allows 64 watches per view; keep well under it.
  const WATCH_BUDGET = 48;
  let watchesInUse = 0;
  // body: the card details are parsed from it. head and base: stacked PRs.
  const ISSUE_FIELDS = ["number", "title", "body", "state", "labels", "created_at", "updated_at"];
  const PR_FIELDS = ["number", "title", "body", "state", "draft", "merged", "merged_at", "labels", "head", "base", "created_at", "updated_at"];
  const PARTS = ["issuesOpen", "issuesClosed", "prsOpen", "prsClosed"];
  const PR_PAGE = { open: 100, closed: 50 };
  const loads = new Map(); // "owner/name" -> { full, watched, unsubs, poll, parts, errors, checks, checkReads, storedAt }

  function readsFor(full) {
    const { owner, repo } = splitRepo(full);
    // Landed's window plus a day, from the start of the UTC day: a stable input, so the cache
    // and the poll keep one identity all day.
    const closedSince = new Date(Math.floor(Date.now() / DAY) * DAY - LANDED_WINDOW - DAY).toISOString();
    return {
      issuesOpen: ["list_issues", { owner, repo, state: "OPEN", perPage: 100, orderBy: "UPDATED_AT", direction: "DESC", fields: ISSUE_FIELDS }],
      issuesClosed: ["list_issues", { owner, repo, state: "CLOSED", since: closedSince, perPage: 50, orderBy: "UPDATED_AT", direction: "DESC", fields: ISSUE_FIELDS }],
      // Open PRs on their own, least recently updated first, so the ones waiting longest are never
      // pushed out by busy ones; closed PRs (for Landed) newest first.
      prsOpen: ["list_pull_requests", { owner, repo, state: "open", perPage: PR_PAGE.open, sort: "updated", direction: "asc", fields: PR_FIELDS }],
      prsClosed: ["list_pull_requests", { owner, repo, state: "closed", perPage: PR_PAGE.closed, sort: "updated", direction: "desc", fields: PR_FIELDS }],
    };
  }
  const listOf = (payload, key) => (Array.isArray(payload) ? payload : Array.isArray(payload?.[key]) ? payload[key] : []);

  function watchProject(full) {
    stopProject(full);
    const reads = Object.entries(readsFor(full));
    const load = { full, watched: watchesInUse + reads.length <= WATCH_BUDGET, unsubs: [], poll: null, refetch: null, parts: {}, errors: {}, checks: {}, checkReads: {}, comments: {}, commentReads: {}, storedAt: null, ship: { phase: "loading" } };
    loads.set(full, load);
    const current = () => loads.get(full) === load;
    const deliver = (part, result) => {
      if (!current()) return;
      load.parts[part] = listOf(result.payload, part.startsWith("prs") ? "pull_requests" : "issues");
      delete load.errors[part];
      load.storedAt = Math.max(load.storedAt ?? 0, result.cache?.storedAt ?? Date.now());
      if (part === "prsOpen") readChecks(load);
      if (part.startsWith("issues")) readComments(load);
      scheduleRender();
    };
    const fail = (part, error) => {
      if (!current()) return;
      const code = codeOf(error);
      if (code === "cancelled") return;
      // GitHub refused outright: the whole page hangs on it, so say so once, page-wide.
      if (DENIED.has(code)) return showConnector(code);
      // Anything else: this part's error shows on the project's row, which keeps the cards it has.
      load.errors[part] = { code, message: error?.message ?? "" };
      scheduleRender();
    };
    if (load.watched) {
      for (const [part, [tool, input]] of reads) {
        watchesInUse += 1;
        let live = true;
        const unsub = state.mcp.watchTool(GH, tool, input, (ev) => (ev.type === "error" ? fail(part, ev.error) : deliver(part, ev.result)), { refetchInterval: REFETCH });
        load.unsubs.push(() => { if (live) { live = false; unsub(); watchesInUse -= 1; } });
      }
    } else {
      load.poll = (refresh = false) => {
        for (const [part, [tool, input]] of reads) readOnce(tool, input, { refresh }).then((r) => deliver(part, r), (e) => fail(part, e));
      };
      load.poll();
    }
    // After a write: read this project again now, not at the next 5-minute refetch. A watched read
    // re-runs when its cache entry is invalidated; a shell without invalidate reads it fresh instead.
    load.refetch = () => {
      if (!current() || !state.mcp) return;
      if (!load.watched) return load.poll(true);
      for (const [part, [tool, input]] of reads) {
        state.mcp.invalidate(GH, tool, input).catch(() =>
          readOnce(tool, input, { refresh: true }).then((r) => deliver(part, r), (e) => fail(part, e)));
      }
    };
    readShip(load);
  }

  // ---- The ship.yml gate: actions need version 2 or later on the default branch, as /ship:land does.
  // Read once per project load, and again on Refresh, so a just-merged upgrade counts.
  const SHIP_YML = ".github/workflows/ship.yml";
  function readShip(load) {
    if (!state.tools.github.has("get_file_contents")) { load.ship = { phase: "failed", code: "no file reads" }; return; }
    load.ship = { ...load.ship, phase: load.ship.phase === "ready" ? "ready" : "loading" };
    const settle = (ship) => { if (loads.get(load.full) === load) { load.ship = ship; scheduleRender(); } };
    readOnce("get_file_contents", { ...splitRepo(load.full), path: SHIP_YML }, { cache: false }).then(
      (r) => settle({ phase: "ready", ...shipYml(fileText(r)) }),
      (e) => settle(isMissingFile(e) ? { phase: "ready", ...shipYml(null) } : { phase: "failed", code: codeOf(e) }));
  }

  // Whether a project's actions can run, and if not, the note that says why. tool: the write it needs.
  function gateOf(full, tool) {
    const ship = loads.get(full)?.ship ?? { phase: "loading" };
    if (!state.tools.github.has(tool)) return { ok: false, note: [`Your GitHub connector has no ${tool}, so this can't run from here.`] };
    if (ship.phase === "loading") return { ok: false, note: ["Checking ship.yml…"] };
    if (ship.phase === "failed") return { ok: false, note: [`Couldn't read ship.yml (${ship.code}): Refresh to try again.`] };
    if (!actionsEnabled(ship.version)) {
      const what = ship.version == null ? "No ship.yml version 2 or later on the default branch" : `ship.yml is version ${ship.version}`;
      return { ok: false, note: [`${what}: run `, el("code", { text: "/ship:setup-ship" }), " to upgrade."] };
    }
    return { ok: true };
  }

  // ---- Actions. Each click makes one write (never retried: a failed write may still have run),
  // then the project is read again at once. Their state lives here, outside the render, keyed like
  // their buttons, so a re-render keeps "running" and errors where they were.
  const actions = new Map(); // key -> { kind, status: "running" | "done" | "error", text, at, label, bucket, moved }
  const DONE_FOR = 60e3;

  // Progress and outcomes are read out from one live region outside the re-rendered board, once each.
  function announce(text) {
    const region = $("announce");
    region.textContent = "";
    setTimeout(() => { region.textContent = text; }, 50);
  }

  // The page's only writes. Its capability grants the whole issue_write and actions_run_trigger
  // tools (a capability can't be narrowed to methods), so the page holds itself to issue_write's
  // update with labels and actions_run_trigger's run_workflow on ship.yml, here and nowhere else
  // (build.test.mjs checks every call site).
  const WRITES = {
    issue_write: { method: "update", keys: ["method", "owner", "repo", "issue_number", "labels"] },
    actions_run_trigger: { method: "run_workflow", keys: ["method", "owner", "repo", "workflow_id", "ref"], workflow_id: "ship.yml" },
  };
  async function callWrite(tool, input, verb) {
    const allowed = WRITES[tool];
    const ok = allowed && input.method === allowed.method && Object.keys(input).every((k) => allowed.keys.includes(k)) &&
      (!allowed.workflow_id || input.workflow_id === allowed.workflow_id);
    if (!ok) throw { shown: `This page doesn't ${verb} that way.` };
    try {
      return await state.mcp.callTool(GH, tool, input, { cache: false });
    } catch (e) {
      throw { code: e?.code, message: e?.message, verb };
    }
  }

  // meta: { label (what it acts on: "#12" or the project), running (its progress words, announced
  // at the start; none for a skill, which may first ask for an environment), bucket }.
  // refetch: whether the project is read again afterwards (a session start changes nothing on GitHub).
  async function runAction(key, kind, full, meta, work, { refetch = true } = {}) {
    if (actions.get(key)?.status === "running") return;
    actions.set(key, { kind, status: "running", ...meta });
    if (meta.running) announce(`${meta.running} ${meta.label}`);
    scheduleRender();
    try {
      const done = await work();
      // null: nothing was done (a picker closed without a choice), so back to idle.
      if (done === null) { actions.delete(key); scheduleRender(); return; }
      const text = done?.text ?? done;
      actions.set(key, { kind, status: "done", text, url: done?.url ?? null, at: Date.now(), ...meta });
      announce(done?.said ?? `${text} ${meta.label}`);
      if (refetch) loads.get(full)?.refetch?.();
    } catch (e) {
      const text = e?.shown ?? writeError(e, { verb: e?.verb, who: e?.who, check: e?.check });
      actions.set(key, { kind, status: "error", text, refetch: Boolean(e?.refetch), ...meta });
      announce(text);
      // A write that may have run, or a PR that changed: read the project again, so the page shows what GitHub has.
      if (refetch && (!e?.shown || e.refetch)) loads.get(full)?.refetch?.();
    }
    scheduleRender();
  }

  // Once a refetch has moved an approved (or un-approved) card to another bucket, say where it went.
  function announceMoves(cards) {
    for (const [key, act] of actions) {
      if (act.status !== "done" || act.moved || !act.bucket || !key.startsWith("pr:")) continue;
      const card = cards.find((c) => `pr:${c.project}#${c.number}` === key);
      if (!card || card.bucket === act.bucket) continue;
      act.moved = true;
      announce(`${act.text} ${act.label}, moved to ${BUCKETS.find((b) => b.id === card.bucket).title}`);
    }
  }

  // Pointer clicks on an action button (Cancel aside) just after the cards moved are ignored, so a card sliding
  // under the pointer (an approved card leaving Needs you) can't take a click meant for the one
  // before it. Keyboard clicks (detail 0) aren't held back here, focus follows its card (Confirm has its own hold).
  const SETTLE = 500;
  let settleUntil = 0;
  let layout = "";
  function noteLayout(cards) {
    const next = cards.map((c) => `${c.bucket}:${c.project}#${c.number}`).join(" ");
    if (next !== layout) settleUntil = performance.now() + SETTLE;
    layout = next;
  }

  // One action button (Approve, Un-approve, Land, Confirm, Cancel, a card's run-a-skill), and the note that says why it's
  // off. Off or busy, it is aria-disabled rather than disabled, so it keeps focus through a re-render
  // and an off one reads its reason (aria-describedby). off: the note's nodes, or null when it can run.
  // held: aria-disabled with no note (an outcome just shown, until the refetch catches up).
  // waiting: aria-disabled, but its click still reaches onClick, which says why it can't run yet.
  // keysFrom: keyboard clicks before this time (performance.now()) are ignored, and a held key's
  // repeats always are (Confirm, which takes focus from Land under a key that may still be down).
  function actionButton({ key, text, hint, primary = false, small = false, off = null, busy = false, held = false, waiting = false, keysFrom = 0, noteClass = "act-note", settle = true, onClick }) {
    const noteId = `why-${key.replace(/[^\w-]/g, "_")}`;
    const note = off ? el("p", { class: noteClass, id: noteId }, ...off) : null;
    const cls = ["btn", small && "small", primary && !off && "primary", off && "is-off", busy && "is-busy"].filter(Boolean).join(" ");
    const button = el("button", { class: cls, type: "button", title: off ? note.textContent : hint, "data-key": key }, text);
    if (off || busy || held || waiting) button.setAttribute("aria-disabled", "true");
    if (off) button.setAttribute("aria-describedby", noteId);
    if (busy) button.setAttribute("aria-busy", "true");
    button.addEventListener("click", (ev) => {
      if (off || busy || held || (settle && ev.detail > 0 && performance.now() < settleUntil)) return;
      if (keysFrom && ev.detail === 0 && performance.now() < keysFrom) return;
      onClick();
    });
    if (keysFrom) button.addEventListener("keydown", (ev) => { if (ev.repeat) ev.preventDefault(); });
    return [button, note];
  }

  const LABEL_ACTION = {
    approve: { idle: "Approve", running: "Approving…", hint: "Adds ship: it lands with the next landing run" },
    "review-first": { idle: "Approve", running: "Approving…", hint: "" },
    unapprove: { idle: "Un-approve", running: "Un-approving…", hint: "Removes ship: it won't land until approved again" },
  };

  // Approve and Un-approve: one issue_write with the PR's whole label list, ship added or removed.
  // The PR is read fresh just before: the labels written are that read's (so none added since the
  // last refetch is dropped), and it must still offer the card's action (board.mjs's labelWrite).
  // If the read fails, or the PR changed, nothing is written.
  function labelAction(card) {
    const approve = card.action === "approve";
    const verb = approve ? "approve" : "un-approve";
    const { owner, repo } = splitRepo(card.project);
    const meta = { label: `#${card.number}`, running: LABEL_ACTION[card.action].running, bucket: card.bucket };
    runAction(`pr:${card.project}#${card.number}`, card.action, card.project, meta, async () => {
      let fresh;
      try {
        fresh = (await readOnce("pull_request_read", { method: "get", owner, repo, pullNumber: card.number }, { cache: false })).payload;
      } catch {
        fresh = undefined;
      }
      const write = labelWrite(card, fresh);
      if (write.error) throw { shown: write.error, refetch: write.refetch };
      if (write.already) return approve ? "Already approved" : "Already un-approved";
      await callWrite("issue_write", { method: "update", owner, repo, issue_number: card.number, labels: write.labels }, verb);
      return approve ? "Approved" : "Un-approved";
    });
  }

  // Land: one actions_run_trigger dispatching ship.yml on the default branch, as /ship:land does.
  // Then its run is looked for a few times over about ten seconds (reads, through the pool); if it
  // hasn't appeared, the row says "dispatched" without a link.
  const RUN_LOOKS = 4;
  const RUN_WAIT = 2500;
  function landAction(full) {
    const branch = loads.get(full)?.ship?.defaultBranch;
    if (!branch) return;
    const { owner, repo } = splitRepo(full);
    runAction(`land:${full}`, "land", full, { label: full, running: "Starting a landing run on" }, async () => {
      const clickedAt = Date.now();
      await callWrite("actions_run_trigger", { method: "run_workflow", owner, repo, workflow_id: "ship.yml", ref: branch }, "start a landing run");
      const said = `Landing run started on ${full}`;
      if (!state.tools.github.has("actions_list")) return { text: `Dispatched on ${branch}.`, said };
      for (let i = 0; i < RUN_LOOKS; i += 1) {
        await sleep(RUN_WAIT);
        try {
          const runs = await readOnce("actions_list", { method: "list_workflow_runs", owner, repo, resource_id: "ship.yml", workflow_runs_filter: { event: "workflow_dispatch" }, perPage: 1 }, { cache: false });
          const run = landingRun(runs.payload, clickedAt);
          if (run) return { text: "Landing run started:", url: run.url, said };
        } catch {
          // Only the link is missing: the dispatch went through.
        }
      }
      return { text: `Dispatched on ${branch}. The run hasn't shown up yet: see the repo's Actions tab.`, said };
    });
  }

  // ---- Run a skill: a card's button starts a Claude cloud session on its repo, through Claude Code
  // Remote, with the skill's command (board.mjs's skillFor) as its first message. One create_session
  // per click, never retried: a failed start may still have made a session.
  const SESSION_TOOLS = ["list_environments", "create_session"];
  const sessionsOn = () => SESSION_TOOLS.every((t) => state.tools.remote.has(t));
  const SESSIONS_URL = "https://claude.ai/code";
  const ENV_CACHE = { staleTime: 60e3, gcTime: 5 * 60e3 };
  const remoteFailure = (e, verb) => Object.assign(Object.create(null), { code: e?.code, message: e?.message, verb, who: "Claude Code Remote", check: "Check your sessions at claude.ai/code" });

  // The viewer's environments (list_environments), read again after a minute so one deleted since
  // isn't offered.
  async function environments() {
    try {
      const r = await readOnce("list_environments", { limit: 100 }, { server: REMOTE, cache: ENV_CACHE });
      return listOf(r.payload, "environments").filter((e) => e?.environment_id);
    } catch (e) {
      throw remoteFailure(e, "list your environments");
    }
  }

  async function startSession(card, skill, env) {
    let result;
    try {
      result = await state.mcp.callTool(REMOTE, "create_session", {
        prompt: skill.command,
        title: `${skill.command} · ${card.project}`,
        source_url: `https://github.com/${card.project}`,
        environment_id: env.environment_id,
      }, { cache: false });
    } catch (e) {
      throw remoteFailure(e, "start a session");
    }
    const link = sessionLink(result);
    const said = `Session started for #${card.number} in ${env.name}`;
    return link ? { text: `Started in ${env.name}`, url: link.url, said } : { text: `Started in ${env.name}: its link didn't come back, so find it among your sessions.`, url: SESSIONS_URL, said };
  }

  // The environment chosen for a project, per viewer: { id, name }, or null when none is chosen yet.
  // Without browser storage the store's in-memory copy remembers it only until the page is closed.
  const envKey = (full) => `env:${full.toLowerCase()}`;
  // A card's run-a-skill button and its "change" button, as data-keys and action keys.
  const skillKey = (card) => `skill:${card.project}#${card.number}`;
  const envChangeKey = (card) => `envchange:${card.project}#${card.number}`;
  const storedEnv = (full) => { const v = store.get(envKey(full), null); return typeof v?.id === "string" ? v : null; };

  // The picker: the viewer's environments, the current choice (else board.mjs's preselection) checked
  // and the preselected one tagged. → the chosen environment, or null when closed without one.
  // opener: the data-key focus returns to. There is one #picker, so one picker at a time: skillAction
  // never opens a second, and one asked for while the dialog is open closes at once (null) without
  // touching it. Only the picker that opened the dialog listens on it, until it closes.
  function pickEnvironment(full, envs, { starting, opener }) {
    const dialog = $("picker");
    if (dialog.open) return Promise.resolve(null);
    const suggested = preselectEnvironment(envs, full);
    const current = envs.find((e) => e.environment_id === storedEnv(full)?.id) ?? suggested;
    $("picker-hint").textContent = `For sessions on ${full}. This browser remembers the choice.`;
    $("picker-ok").textContent = starting ? "Start session" : "Use this environment";
    $("picker-list").replaceChildren(el("legend", { class: "sr-only", text: "Environments" }), ...envs.map((e) => {
      const input = el("input", { type: "radio", name: "env", value: e.environment_id });
      input.checked = e === current;
      const meta = [e.kind === "bridge" ? "your machine" : "cloud", e.description].filter(Boolean).join(" · ");
      return el("label", { class: "env-option" }, input,
        el("span", { class: "env-text" }, el("span", { class: "env-name", text: e.name || e.environment_id }), el("span", { class: "env-meta", text: meta })),
        e === suggested ? el("span", { class: "env-tag", text: "suggested" }) : null);
    }));
    return new Promise((resolve) => {
      const form = $("picker-form");
      const finish = (env) => {
        form.removeEventListener("submit", onSubmit);
        $("picker-cancel").removeEventListener("click", onCancel);
        dialog.removeEventListener("close", onClose);
        dialog.removeEventListener("click", onBackdrop);
        if (dialog.open) dialog.close();
        resolve(env);
        // The card was redrawn while the picker was open: the next paint focuses its replacement.
        focusNext = opener;
        scheduleRender();
      };
      const onSubmit = (event) => {
        event.preventDefault();
        const id = form.elements.env?.value;
        finish(envs.find((e) => e.environment_id === id) ?? null);
      };
      const onCancel = () => finish(null);
      const onClose = () => finish(null);
      const onBackdrop = (event) => { if (event.target === dialog) finish(null); };
      form.addEventListener("submit", onSubmit);
      $("picker-cancel").addEventListener("click", onCancel);
      dialog.addEventListener("close", onClose);
      dialog.addEventListener("click", onBackdrop);
      dialog.showModal();
      (form.querySelector("input:checked") ?? form.querySelector("input"))?.focus();
    });
  }

  // The skill action whose environment is being settled (environments read, picker open): board.mjs's
  // singleFlight, held by its skill key. While one is, every other skill or "change" click is refused
  // and said so, and the other skill buttons are aria-disabled, so two clicks in quick succession never
  // share the one picker (one submit would start both).
  const choosing = singleFlight();
  const cardOfKey = (key) => key.replace(/^skill:/, "");

  // A run-a-skill click starts at once in the project's stored environment while it still exists;
  // otherwise (first run, environment gone) the picker asks first. change: only pick and store,
  // start nothing.
  function skillAction(card, skill, { change = false } = {}) {
    const key = skillKey(card);
    if (actions.get(key)?.status === "running") return;
    if (!choosing.tryEnter(key)) {
      const other = choosing.holder();
      if (other !== key) announce(`Choosing an environment for ${cardOfKey(other)} first`);
      return;
    }
    const opener = change ? envChangeKey(card) : key;
    const meta = { label: `#${card.number}` };
    runAction(key, "skill", card.project, meta, async () => {
      let env;
      try {
        const envs = await environments();
        if (!envs.length) throw { shown: "You have no Claude Code environment to run it in: create one at claude.ai/code, then try again." };
        env = change ? null : envs.find((e) => e.environment_id === storedEnv(card.project)?.id);
        if (!env) {
          actions.set(key, { kind: "skill", status: "running", choosing: true, ...meta });
          scheduleRender();
          env = await pickEnvironment(card.project, envs, { starting: !change, opener });
          if (!env) return null;
          store.set(envKey(card.project), { id: env.environment_id, name: env.name });
          if (change) { announce(`Sessions on ${card.project} run in ${env.name || env.environment_id}`); return null; }
          actions.set(key, { kind: "skill", status: "running", ...meta });
          scheduleRender();
        }
      } finally {
        choosing.leave(key);
        scheduleRender();
      }
      announce(`Starting ${skill.command} in ${env.name || env.environment_id}`);
      return startSession(card, skill, env);
    }, { refetch: false });
  }

  // A card's run-a-skill button (actionButton, so a pointer click just after the cards moved is
  // held back like Approve's); once started, the "Open session" link in its place (same data-key,
  // so focus moves to it). Hidden without Claude Code Remote's session tools.
  function renderSkill(card) {
    const skill = skillFor(card);
    if (!skill || !sessionsOn()) return [];
    const key = skillKey(card);
    const act = actions.get(key);
    if (act?.status === "done") {
      const text = act.url === SESSIONS_URL ? "Open sessions" : "Open session";
      return [el("a", { class: "btn session-link", href: act.url, target: "_blank", rel: "noopener noreferrer", "data-key": key, "aria-label": `${text} (opens in a new tab)`, text }),
        el("p", { class: "act-done", text: act.text })];
    }
    const running = act?.status === "running";
    // Another card's environment is being chosen: this one waits (aria-disabled, its click announced).
    const waiting = choosing.holder() !== null && choosing.holder() !== key;
    const [button] = actionButton({ key, text: running && !act.choosing ? "Starting…" : skill.label, busy: running,
      waiting,
      hint: `Start a Claude session on ${card.project} running ${skill.command}`, onClick: () => skillAction(card, skill) });
    // The stored environment, and "change" to pick again (no line until there's a stored choice).
    const env = storedEnv(card.project);
    let line = null;
    if (env) {
      const change = el("button", { class: "linklike", type: "button", "data-key": envChangeKey(card), "aria-label": `Change the environment for ${card.project}`, text: "change" });
      if (running || waiting) change.setAttribute("aria-disabled", "true");
      change.addEventListener("click", () => skillAction(card, skill, { change: true }));
      line = el("p", { class: "env-line" }, el("span", { text: `Runs in ${env.name || env.id}` }), change);
    }
    return [button, line, act?.status === "error" ? el("p", { class: "act-error", text: act.text }) : null];
  }

  // Land asks first, in place: "Land 2 PRs: #4, #7?" with Confirm and Cancel, listing the PRs the
  // board shows carrying ship for that project. Projects whose Land is waiting on that answer:
  const confirming = new Map(); // project -> when it opened (performance.now()): Confirm ignores keys until SETTLE after
  let focusNext = null; // a data-key to focus after the next paint (Cancel hands focus back to Land)

  // A project row's Land button and the line under it: the question, progress, the run link, the error or the gate.
  function renderLand(full) {
    const key = `land:${full}`;
    const act = actions.get(key);
    let gate = gateOf(full, "actions_run_trigger");
    const branch = loads.get(full)?.ship?.defaultBranch;
    if (gate.ok && !branch) gate = { ok: false, note: ["ship.yml's push trigger names no branch as a list (branches: [main]), so the page can't tell where to land: run ", el("code", { text: "/ship:setup-ship" }), " to upgrade."] };
    const running = act?.status === "running";
    if (!gate.ok || running) confirming.delete(full);
    if (confirming.has(full)) {
      const shipped = cardsOf(full).filter((c) => c.kind === "pr" && c.action === "unapprove").sort((a, b) => a.number - b.number);
      const question = shipped.length ? `Land ${plural(shipped.length, "PR")}: ${shipped.map((c) => `#${c.number}`).join(", ")}?` : "No PR on the board carries ship here. Start a landing run anyway?";
      // Enter on Land moves focus to Confirm (same data-key), so a held or doubled Enter would land:
      // Confirm ignores key repeats, and keyboard clicks for SETTLE after it opens.
      const [confirm] = actionButton({ key, text: "Confirm", primary: true, small: true, hint: `Start ship.yml on ${branch}`,
        keysFrom: confirming.get(full) + SETTLE, onClick: () => { confirming.delete(full); landAction(full); } });
      const cancelIt = () => { confirming.delete(full); focusNext = key; scheduleRender(); };
      const [cancel] = actionButton({ key: `land-cancel:${full}`, text: "Cancel", small: true, hint: "Don't land", settle: false, onClick: cancelIt });
      const askId = `ask-${key.replace(/[^\w-]/g, "_")}`;
      confirm.setAttribute("aria-describedby", askId);
      const group = el("div", { class: "land land-confirm", role: "group", "aria-label": `Land ${full}?` }, confirm, cancel);
      group.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { ev.preventDefault(); cancelIt(); } });
      return [group, el("p", { class: "land-msg", id: askId }, question)];
    }
    const [button, note] = actionButton({ key, text: running ? "Starting…" : "Land", small: true, busy: running, noteClass: "land-msg",
      hint: `Start ship.yml on ${branch}: it lands every approved PR that targets ${branch}`, off: gate.ok ? null : gate.note,
      onClick: () => {
        confirming.set(full, performance.now());
        settleUntil = performance.now() + SETTLE; // a double click doesn't confirm
        const shipped = cardsOf(full).filter((c) => c.kind === "pr" && c.action === "unapprove").length;
        announce(`Land ${full}: ${shipped ? plural(shipped, "approved PR") : "no approved PR shown"}. Confirm or cancel.`);
        scheduleRender();
      } });
    button.classList.add("land");
    let msg = note;
    if (!msg && act?.status === "error") msg = el("p", { class: "land-msg act-error", text: act.text });
    else if (!msg && act?.status === "done") msg = el("p", { class: "land-msg" }, act.text, act.url ? " " : null,
      act.url ? el("a", { href: act.url, target: "_blank", rel: "noopener noreferrer", text: "open the run", "data-key": `run:${full}` }) : null);
    return [button, msg];
  }

  function stopProject(full) {
    const load = loads.get(full);
    if (!load) return;
    load.unsubs.forEach((u) => u());
    loads.delete(full);
  }

  // Checks for each ready open PR (drafts are still being built), as one-shot reads through the pool.
  // board.mjs's needsCheckRead decides which PRs are read again.

  function readChecks(load, refresh = false) {
    if (!state.tools.github.has("pull_request_read")) return;
    const { owner, repo } = splitRepo(load.full);
    const ready = (load.parts.prsOpen ?? []).filter((p) => isOpenPr(p) && !p.draft);
    const live = new Set(ready.map((p) => String(p.number)));
    for (const n of Object.keys(load.checkReads)) if (!live.has(n)) { delete load.checkReads[n]; delete load.checks[n]; }
    for (const p of ready) {
      if (!needsCheckRead(load.checkReads[p.number], load.checks[p.number], p, refresh)) continue;
      const read = { updatedAt: p.updated_at, pending: true };
      load.checkReads[p.number] = read;
      const one = (method) => readOnce("pull_request_read", { method, owner, repo, pullNumber: p.number }, { refresh });
      Promise.all([one("get_check_runs"), one("get_status")]).then(([runs, status]) => {
        load.checks[p.number] = { check_runs: runs.payload?.check_runs ?? [], statuses: status.payload?.statuses ?? [] };
      }, (e) => {
        // Not "no failing checks": unknown, and the project's row says so.
        load.checks[p.number] = { unknown: true, code: codeOf(e) };
      }).finally(() => {
        read.pending = false;
        if (loads.get(load.full) === load) scheduleRender();
      });
    }
  }

  // Comments for the morning-page link: only on the specs board.mjs's morningSpecs picks (updated
  // in the last 7 days, at most 3), one-shot through the pool's low-priority lane (behind every
  // list and check read, at most 2 at a time), after an issue list arrives, never per render.
  // board.mjs's needsCommentRead decides which specs are read again.
  function readComments(load) {
    const { issuesOpen, issuesClosed } = load.parts;
    if (!state.tools.github.has("issue_read") || !issuesOpen || !issuesClosed) return;
    const { owner, repo } = splitRepo(load.full);
    const specs = morningSpecs([...issuesOpen, ...issuesClosed], Date.now());
    const keep = new Set(specs.map((i) => String(i.number)));
    for (const n of Object.keys(load.commentReads)) if (!keep.has(n)) { delete load.commentReads[n]; delete load.comments[n]; }
    for (const i of specs) {
      if (!needsCommentRead(load.commentReads[i.number], i)) continue;
      const read = { updatedAt: i.updated_at, pending: true, failed: false };
      load.commentReads[i.number] = read;
      readOnce("issue_read", { method: "get_comments", owner, repo, issue_number: i.number, perPage: 100 }, { low: true }).then((r) => {
        load.comments[i.number] = listOf(r.payload, "comments");
      }, () => { read.failed = true; }).finally(() => {
        read.pending = false;
        if (loads.get(load.full) === load) scheduleRender();
      });
    }
  }

  const loaded = (load) => load && PARTS.every((k) => load.parts[k]);
  const errorsOf = (load) => Object.values(load?.errors ?? {});
  // A project is "ready" once every read has answered (later failures show on its row),
  // "failed" when a read failed before that, "loading" otherwise.
  const phaseOf = (load) => (loaded(load) ? "ready" : errorsOf(load).length ? "failed" : "loading");
  // A read that came back full may have left PRs out: open ones past the page, or closed ones
  // still inside Landed's window.
  const prsCut = (load) => {
    const { prsOpen = [], prsClosed = [] } = load.parts;
    const last = prsClosed[prsClosed.length - 1];
    return prsOpen.length >= PR_PAGE.open ||
      (prsClosed.length >= PR_PAGE.closed && last && Date.now() - Date.parse(last.updated_at) < LANDED_WINDOW);
  };
  const uncheckedOf = (load) => Object.values(load?.checks ?? {}).filter((c) => c.unknown).length;

  function cardsOf(full) {
    const load = loads.get(full);
    if (!loaded(load)) return [];
    const { issuesOpen, issuesClosed, prsOpen, prsClosed } = load.parts;
    return toCards(full, [...issuesOpen, ...issuesClosed], [...prsOpen, ...prsClosed], load.checks, Date.now());
  }

  function stopAll() {
    for (const full of [...loads.keys()]) stopProject(full);
  }

  // Start reading new projects, stop reading ones no longer listed.
  function syncWatches() {
    const list = projects();
    for (const full of [...loads.keys()]) if (!list.includes(full)) stopProject(full);
    for (const full of list) if (!loads.has(full)) watchProject(full);
  }

  // The read-once projects' poll: one timer for the page, paused while the page is hidden.
  setInterval(() => {
    if (!state.mcp || document.hidden) return;
    for (const load of loads.values()) load.poll?.();
  }, REFETCH);

  // A file-read refusal (or a lost connector) is re-tested from the start: boot() asks the
  // connector for its tools again and clears the refusal, so Add repo and Rescan come back if allowed.
  async function refresh() {
    if (!state.mcp || connectorShowing() || state.fileReads) return boot();
    try { await state.mcp.invalidate(GH); } catch { stopAll(); syncWatches(); }
    for (const load of loads.values()) { load.poll?.(true); readChecks(load, true); readShip(load); }
  }

  // ---- Rendering

  const TONE = Object.fromEntries(BUCKETS.map((b) => [b.id, b.tone]));
  const KIND_LABEL = { spec: "Spec", design: "Design", pr: "PR" };

  // A link out of a card. Its URL came from a body or comment, so board.mjs's safeUrl has already
  // kept it to https (and to claude.ai where hosts says so); it is checked again here, where it becomes an href.
  const CLAUDE_ONLY = ["claude.ai"];
  const outLink = (url, text, key, hosts) => {
    const href = safeUrl(url, hosts);
    return href ? el("a", { href, target: "_blank", rel: "noopener noreferrer", text, "data-key": key }) : null;
  };
  const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
  // Verdict lines opened with a tap (or Enter), by data-key, so a re-render keeps them open.
  const openVerdicts = new Set();

  // The details under a card's title: what decides the next step, and links to read more.
  function renderDetails(card) {
    const key = `${card.project}#${card.number}`;
    const rows = [];
    const facts = [];
    if (card.kind === "spec") {
      if (card.openQuestions > 0) facts.push(el("span", { class: "fact-warn", text: plural(card.openQuestions, "open question") }));
      if (card.pr) facts.push(outLink(card.pr.url, `PR #${card.pr.number}`, `pr:${key}`, ["github.com"]));
    }
    if (card.kind === "design") facts.push(outLink(card.designUrl, "Open design", `design:${key}`, CLAUDE_ONLY));
    if (card.kind === "pr") {
      const r = card.review;
      if (r?.line) {
        const vkey = `verdict:${key}`;
        const rest = r.line.slice(r.verdict.length);
        // One line, cut; a tap (or Enter, or Space) opens it in full and closes it again.
        const verdict = el("button", { type: "button", class: `card-verdict${r.tone ? ` v-${r.tone}` : ""}`, "aria-expanded": String(openVerdicts.has(vkey)),
          "aria-label": `Review verdict: ${r.line}`, title: r.line, "data-key": vkey }, el("b", { text: r.verdict }), rest);
        verdict.addEventListener("click", () => {
          const open = !openVerdicts.delete(vkey);
          if (open) openVerdicts.add(vkey);
          verdict.setAttribute("aria-expanded", String(open));
        });
        rows.push(verdict);
      }
      if (!r) facts.push(el("span", { text: "not reviewed yet" }));
      else if (r.outOfDate) facts.push(el("span", { class: "fact-warn", text: "review out of date" }));
      else if (r.risks != null) facts.push(el("span", { class: r.risks ? "fact-warn" : "", text: r.risks ? plural(r.risks, "risk") : "no risks" }));
      if (card.landsAfter) facts.push(el("span", { text: `lands after #${card.landsAfter}` }));
      facts.push(outLink(r?.reportUrl, "Full report", `report:${key}`, CLAUDE_ONLY), outLink(r?.previewUrl, "Preview", `preview:${key}`));
    }
    const shown = facts.filter(Boolean);
    if (shown.length) rows.push(el("div", { class: "card-facts" }, ...shown));
    return rows.length ? el("div", { class: "card-details" }, ...rows) : null;
  }

  // A card's buttons, in one row: Approve or Un-approve, then its run-a-skill button.
  function renderCardActions(card) {
    const nodes = [...renderLabelAction(card), ...renderSkill(card)].filter(Boolean);
    return nodes.length ? el("div", { class: "card-actions" }, ...nodes) : null;
  }

  // A PR card's Approve or Un-approve, with its progress, outcome, error, or why it's off: the gate,
  // or a review missing or out of date (Approve is withheld until the PR is reviewed again).
  function renderLabelAction(card) {
    if (!card.action) return [];
    const key = `pr:${card.project}#${card.number}`;
    let act = actions.get(key);
    // An outcome stays under the button for a minute, wherever the card has moved.
    if (act?.status === "done" && Date.now() - act.at > DONE_FOR) { actions.delete(key); act = null; }
    // A "changed: refreshing" error goes once the refetch shows the card's new action.
    if (act?.status === "error" && act.refetch && card.action !== act.kind) { actions.delete(key); act = null; }
    const running = act?.status === "running";
    const words = LABEL_ACTION[card.action];
    const gate = gateOf(card.project, "issue_write");
    const stale = card.action === "review-first" ? [card.review?.outOfDate ? "Review out of date: re-run the review first." : "Not reviewed: run the review first."] : null;
    const [button, note] = actionButton({ key: `act:${card.project}#${card.number}`, text: running ? words.running : words.idle,
      hint: words.hint, primary: card.action === "approve", busy: running, off: gate.ok ? stale : gate.note,
      // Done, but the refetch hasn't changed the card yet: the same action again would only be refused.
      held: act?.status === "done" && act.kind === card.action,
      onClick: () => labelAction(card) });
    return [button, note,
      act?.status === "error" ? el("p", { class: "act-error", text: act.text }) : null,
      act?.status === "done" ? el("p", { class: "act-done", text: act.text }) : null];
  }

  // One card. Sibling specs extend the dashboard here: details, actions and sessions hang off the card.
  function renderCard(card) {
    return el("article", { class: `card b-${TONE[card.bucket]}`, "data-project": card.project, "data-kind": card.kind },
      el("div", { class: "card-meta" },
        el("span", { class: "card-project mono", title: card.project, text: card.project }),
        el("span", { class: "card-kind", text: KIND_LABEL[card.kind] }),
      ),
      el("a", { class: "card-title", href: card.url, target: "_blank", rel: "noopener", title: `#${card.number} ${card.title}`, "data-key": `card:${card.project}#${card.number}` },
        el("span", { class: "card-num mono", text: `#${card.number}` }), " ", card.title),
      renderDetails(card),
      el("div", { class: "card-foot" },
        el("span", { class: "card-reason", text: card.reason }),
        el("time", { class: "card-age mono", datetime: card.since, title: new Date(card.since).toLocaleString(), text: card.age }),
      ),
      renderCardActions(card),
    );
  }

  function countPills(tally) {
    return BUCKETS.map((b) => el("span", { class: `pill b-${b.tone}${tally[b.id] ? "" : " zero"}`, title: b.title },
      el("span", { class: "pill-n mono", text: String(tally[b.id]) }), el("span", { class: "pill-label", text: b.title })));
  }

  function projectRow(full, cards) {
    const load = loads.get(full);
    // The newest morning page on the project's recent specs (no link without one).
    const morning = morningPage(Object.values(load?.comments ?? {}).flat());
    const morningLink = morning ? outLink(morning.url, "Morning page", `morning:${full}`, CLAUDE_ONLY) : null;
    morningLink?.classList.add("morning");
    if (morningLink) morningLink.title = `Posted ${new Date(morning.at).toLocaleString()}`;
    const name = el("div", { class: "name" }, el("a", { href: `https://github.com/${full}`, target: "_blank", rel: "noopener", text: full, "data-key": `project:${full}` }), morningLink);
    const errors = errorsOf(load);
    const phase = phaseOf(load);
    if (phase === "failed") {
      const retry = el("button", { class: "btn small", type: "button", text: "Retry", "data-key": `retry:${full}` });
      retry.addEventListener("click", () => { watchProject(full); scheduleRender(); });
      return el("div", { class: "project is-error", "data-project": full }, name,
        el("div", { class: "row-error", text: `Couldn't load: ${errors[0].message || errors[0].code}` }), retry);
    }
    if (phase === "loading") {
      return el("div", { class: "project is-loading", "data-project": full, "aria-busy": "true" }, name,
        el("div", { class: "skeleton", "aria-label": "Loading" }, el("span"), el("span"), el("span"), el("span")),
        el("div", { class: "updated", text: "loading…" }));
    }
    const stale = errors.length ? el("span", { class: "row-stale", text: ` · refresh failed (${errors.map((e) => e.code).join(", ")})` }) : null;
    const unchecked = uncheckedOf(load);
    const warn = unchecked ? el("span", { class: "row-warn", text: `checks couldn't be read for ${unchecked} ${unchecked === 1 ? "PR" : "PRs"}` }) : null;
    const cut = prsCut(load) ? el("span", { class: "row-warn", text: "some PRs not shown" }) : null;
    return el("div", { class: "project", "data-project": full }, name,
      el("div", { class: "counts" }, ...countPills(counts(cards))),
      el("div", { class: "updated" }, load.storedAt ? `updated ${since(load.storedAt)}` : "", stale, warn, cut),
      ...renderLand(full));
  }

  function renderBoard(cards, stillLoading) {
    const board = el("section", { class: "board", "aria-label": "Buckets" });
    for (const b of BUCKETS) {
      const mine = sortBucket(cards.filter((c) => c.bucket === b.id), b.id);
      const empty = el("p", { class: "col-empty", text: stillLoading ? "Loading…" : b.empty });
      board.append(el("section", { class: `col b-${b.tone}`, "data-bucket": b.id, "aria-label": b.title },
        el("h2", {}, el("span", { class: "dot", "aria-hidden": "true" }), b.title, el("span", { class: "col-n mono", text: String(mine.length) })),
        mine.length ? el("div", { class: "cards" }, ...mine.map(renderCard)) : empty));
    }
    return board;
  }

  // ---- Phone: projects become filter chips, buckets become toggle buttons. Remembered per viewer.

  const phone = window.matchMedia("(max-width: 720px)");
  phone.addEventListener?.("change", () => { if (state.mcp) scheduleRender(); });
  const view = { tab: "needs-you", project: "all", ...store.get("view", {}) };
  const setView = (patch) => { Object.assign(view, patch); store.set("view", view); scheduleRender(); };

  function renderChips(list, cardsBy) {
    const chip = (value, label, extra) => {
      const b = el("button", { class: "chip", type: "button", "aria-pressed": String(view.project === value), "data-key": `chip:${value}` }, label, extra);
      b.addEventListener("click", () => setView({ project: value }));
      return b;
    };
    return [chip("all", "All"), ...list.map((full) => {
      const phase = phaseOf(loads.get(full));
      const mark = phase === "ready" ? el("span", { class: "chip-n mono", text: String(counts(cardsBy.get(full))["needs-you"] || "") })
        : el("span", { class: "chip-flag", text: phase });
      const short = full.split("/")[1];
      const clash = list.filter((other) => other.split("/")[1] === short).length > 1;
      return chip(full, clash ? full : short, mark);
    })];
  }

  function renderTabs(tally) {
    return BUCKETS.map((b) => {
      const t = el("button", { class: `tab b-${b.tone}`, type: "button", "aria-pressed": String(view.tab === b.id), "aria-controls": "board", "data-key": `tab:${b.id}` },
        b.title, " ", el("span", { class: "tab-n mono", text: String(tally[b.id]) }));
      t.addEventListener("click", () => setView({ tab: b.id }));
      return t;
    });
  }

  // Renders are coalesced to one per frame. Rebuilding drops the focused node, so the focus is
  // moved to its replacement (matched by data-key).
  let frame = 0;
  function scheduleRender() {
    if (frame) return;
    frame = requestAnimationFrame(() => { frame = 0; if (state.mcp && !$("app").hidden) renderAll(); });
  }

  // When the focused node's replacement isn't shown (a card that moved to a hidden phone tab), focus
  // goes to the card now in its place in the same column, else to the bucket's tab, else Refresh.
  const shown = (node) => !!node && node.getClientRects().length > 0;
  function renderAll() {
    const focused = document.activeElement;
    const key = focusNext ?? focused?.closest?.("[data-key]")?.dataset.key;
    const col = focused?.closest?.("[data-bucket]");
    const bucket = col?.dataset.bucket;
    const at = col ? [...col.querySelectorAll(".card")].indexOf(focused.closest(".card")) : -1;
    const handOff = focusNext;
    focusNext = null;
    paint();
    if (!key || (!handOff && focused.isConnected)) return;
    const target = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (shown(target)) return target.focus({ preventScroll: true });
    const cards = bucket ? [...document.querySelectorAll(`[data-bucket="${bucket}"] .card`)] : [];
    const near = cards[Math.min(Math.max(at, 0), cards.length - 1)];
    const fallback = [near?.querySelector('[data-key^="act:"], [data-key^="skill:"]'), near?.querySelector(".card-title"),
      bucket && document.querySelector(`[data-key="tab:${bucket}"]`), $("refresh")].find(shown);
    fallback?.focus({ preventScroll: true });
  }

  function paint() {
    const list = projects();
    const box = $("projects");
    box.replaceChildren(el("h2", { text: "Projects" }));
    if (!list.length) {
      box.append(el("p", { class: "empty" }, "No repo set up for ship yet: run ", el("code", { text: "/ship:setup-ship" }), " in one."));
      box.classList.remove("phone-hide");
      for (const id of ["board", "chips", "tabs"]) $(id).replaceChildren();
      $("status").textContent = "0 projects";
      return;
    }
    if (view.project !== "all" && !list.includes(view.project)) view.project = "all";
    const cardsBy = new Map(list.map((full) => [full, cardsOf(full)]));
    // On a phone the chip filters what shows; desktop always shows every project.
    const shownProjects = phone.matches && view.project !== "all" ? [view.project] : list;
    const rows = list.map((full) => projectRow(full, cardsBy.get(full)));
    // Phone: a row shows for an error, or, once its chip is picked, for its Land button and
    // morning-page link.
    const picked = view.project !== "all";
    rows.forEach((row) => row.classList.toggle("phone-hide", !shownProjects.includes(row.dataset.project) ||
      !(row.classList.contains("is-error") || (picked && row.querySelector("a.morning, .land")))));
    box.append(...rows);
    box.classList.toggle("phone-hide", rows.every((r) => r.classList.contains("phone-hide")));
    const cards = shownProjects.flatMap((full) => cardsBy.get(full));
    const stillLoading = shownProjects.some((full) => phaseOf(loads.get(full)) === "loading");
    noteLayout(cards);
    announceMoves(cards);
    const board = renderBoard(cards, stillLoading);
    board.dataset.tab = view.tab;
    $("board").replaceChildren(board);
    $("chips").replaceChildren(...renderChips(list, cardsBy));
    $("tabs").replaceChildren(...renderTabs(counts(cards)));
    const newest = Math.max(0, ...list.map((full) => loads.get(full)?.storedAt ?? 0));
    $("status").textContent = `${list.length} ${list.length === 1 ? "project" : "projects"}` + (newest ? ` · updated ${since(newest)}` : "");
  }

  function render() {
    syncWatches();
    scheduleRender();
  }

  async function boot() {
    stopAll();
    state.mcp = null;
    state.fileReads = null;
    note("");
    const problem = await connect();
    if (problem) return showConnector(problem);
    $("connector").hidden = true;
    $("app").hidden = false;
    syncToolbar();
    render();
    if (canDiscover() && !store.get("found", null)) await runDiscover();
    else scanNote();
  }

  $("refresh").addEventListener("click", () => refresh());
  setInterval(() => scheduleRender(), 60e3); // ages and "updated" times move on
  boot();
})();
</script>
