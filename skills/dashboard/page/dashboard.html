<title>Ship dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a header strip, one summary row per project, then the four buckets as columns
   (phone: project chips, bucket tabs, one column). Neutrals lean toward harbour slate. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --fg: #14212b;
  --muted: #566775;
  --line: #d8e0e5;
  --accent: #1d5bb8;
  --needs: #b8410e;
  --ready: #4a3fc4;
  --flight: #0e6f68;
  --landed: #2d7a34;
  --danger: #b42318;
  --skeleton: #e4eaee;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b; --surface: #151e26; --fg: #e2e9ee; --muted: #93a4b2; --line: #26333e; --accent: #82acff;
    --needs: #fb9a5b; --ready: #aaa4ff; --flight: #5fd8cb; --landed: #8bdc8f; --danger: #f98d84; --skeleton: #1e2a34;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151b; --surface: #151e26; --fg: #e2e9ee; --muted: #93a4b2; --line: #26333e; --accent: #82acff;
  --needs: #fb9a5b; --ready: #aaa4ff; --flight: #5fd8cb; --landed: #8bdc8f; --danger: #f98d84; --skeleton: #1e2a34;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 20px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding-block: 20px 4px;
}
header.top h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
header.top .status { color: var(--muted); font-size: 13px; flex: 1 1 auto; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  min-height: 44px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  font-weight: 500; font-size: 14px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn[disabled] { opacity: 0.55; cursor: default; }

.notice {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 20px; display: grid; gap: 10px; max-width: 64ch;
}
.notice h2 { margin: 0; font-size: 17px; font-weight: 600; }
.notice p { margin: 0; color: var(--muted); }
.notice .actions { margin-top: 4px; }
.hint { font-size: 13px; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.addrepo { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; max-width: 460px; }
.addrepo input {
  flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 14px;
}
.addrepo input::placeholder { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.error { color: var(--danger); }

.projects { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.projects h2, .board h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.projects > h2 { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.project {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px 16px;
  padding: 10px 16px; min-height: 52px; border-top: 1px solid var(--line);
}
.projects > h2 + .project { border-top: 0; }
.project .name { font-family: var(--font-mono); font-size: 14px; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.project .name a { text-decoration: none; }
.project .name a:hover { text-decoration: underline; }
.project .updated { color: var(--muted); font-size: 13px; white-space: nowrap; }
.empty { padding: 20px 16px; color: var(--muted); margin: 0; }
.empty code { font-family: var(--font-mono); color: var(--fg); }

.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
}
.pill-n { font-weight: 500; color: var(--tone); }
.pill:not(.zero) { border-color: color-mix(in srgb, var(--tone) 40%, var(--line)); }
.pill.zero .pill-n { color: var(--muted); }
.b-needs { --tone: var(--needs); }
.b-ready { --tone: var(--ready); }
.b-flight { --tone: var(--flight); }
.b-landed { --tone: var(--landed); }
.row-error { color: var(--danger); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.row-stale { color: var(--danger); }
.project.is-error .btn { justify-self: start; }
.skeleton { display: flex; gap: 6px; justify-content: flex-end; }
.skeleton span { width: 72px; height: 22px; border-radius: 999px; background: var(--skeleton); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.col { display: grid; gap: 10px; min-width: 0; }
.col > h2 { display: flex; align-items: center; gap: 8px; padding: 4px 2px; color: var(--fg); }
.col .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; }
.col-n { margin-left: auto; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.col-empty { margin: 0; padding: 12px; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; }
.cards { display: grid; gap: 8px; }
.card {
  display: grid; gap: 6px; padding: 12px; border-radius: 8px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line);
}
.card-meta { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); min-width: 0; }
.card-project { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card-kind { margin-left: auto; flex: none; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
.card-title {
  font-weight: 500; text-decoration: none; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}
.card-title:hover { text-decoration: underline; }
.card-title:focus-visible { -webkit-line-clamp: unset; line-clamp: none; }
.card-num { color: var(--muted); font-weight: 400; }
.card-foot { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.card-reason { color: var(--tone); font-weight: 500; min-width: 0; }
.card-age { margin-left: auto; color: var(--muted); font-size: 12px; flex: none; }

@media (max-width: 1080px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .project { grid-template-columns: minmax(0, 1fr) auto; }
  .project .counts, .project .skeleton { grid-column: 1 / -1; justify-content: flex-start; grid-row: 2; }
}

.chips, .tabs { display: none; }
@media (max-width: 720px) {
  .phone-hide, .projects .phone-hide { display: none; }
  .projects > h2 { display: none; }
  .project.is-error { border-top: 0; }
  .btn.small { min-height: 44px; }
  .chips, .tabs {
    display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none; min-width: 0; padding-block: 2px;
  }
  .chips::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    font-family: var(--font-mono); font-size: 13px;
  }
  .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .chip-n { color: var(--needs); font-weight: 500; }
  .chip[aria-pressed="true"] .chip-n { color: inherit; }
  .chip-flag { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
  .chip[aria-pressed="true"] .chip-flag { color: inherit; opacity: 0.8; }
  .tabs { gap: 0; border-bottom: 1px solid var(--line); }
  .tab {
    flex: none; min-height: 44px; padding: 0 12px; border: 0; background: none; cursor: pointer;
    font-weight: 500; font-size: 14px; color: var(--muted); white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--tone); }
  .tab-n { color: var(--tone); margin-left: 2px; }
  .board .col { display: none; }
  .board[data-tab="needs-you"] .col[data-bucket="needs-you"],
  .board[data-tab="ready"] .col[data-bucket="ready"],
  .board[data-tab="in-flight"] .col[data-bucket="in-flight"],
  .board[data-tab="landed"] .col[data-bucket="landed"] { display: grid; }
  .col > h2 { display: none; }
  .card-title { min-height: 44px; display: -webkit-box; align-content: center; }
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Ship dashboard</h1>
    <div class="status" id="status" aria-live="polite">Connecting to GitHub…</div>
    <div class="actions">
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <section class="notice" id="connector" hidden>
    <h2 id="connector-title">Connect GitHub</h2>
    <p id="connector-text"></p>
    <div class="actions">
      <button class="btn primary" id="permissions" type="button">Open Permissions</button>
    </div>
    <p class="hint" id="permissions-hint" hidden>The Permissions panel didn't open. Use this page's Permissions menu in claude.ai instead.</p>
  </section>

  <main id="app" class="wrap" hidden>
    <div class="toolbar">
      <form class="addrepo" id="addrepo" autocomplete="off">
        <label class="sr-only" for="addrepo-name">Repository to add</label>
        <input id="addrepo-name" name="repo" placeholder="owner/name" spellcheck="false" autocapitalize="off">
        <button class="btn" type="submit" id="addrepo-go">Add repo</button>
      </form>
      <button class="btn" id="rescan" type="button" hidden>Rescan</button>
      <p class="note" id="note" aria-live="polite"></p>
    </div>
    <section class="projects" id="projects" aria-label="Projects"></section>
    <nav class="chips" id="chips" aria-label="Filter by project"></nav>
    <div class="tabs" id="tabs" role="tablist" aria-label="Buckets"></div>
    <div id="board"></div>
  </main>
</div>

<script>
/*@@BOARD@@*/
</script>
<script>
(() => {
  // The connector tools this page calls. Keep in step with the `mcp` capabilities in SKILL.md.
  const CONNECTORS = {
    github: { server: "github", tools: ["list_issues", "list_pull_requests", "pull_request_read", "get_file_contents"] },
    remote: { server: "Claude Code Remote", tools: ["list_repos"] },
  };

  // Codes that mean the viewer has to act before a connector answers.
  const DENIED = new Set(["needs_reauth", "server_not_connected", "selection_required", "server_not_found", "not_in_manifest", "blocked_by_policy", "approval_required", "not_granted", "capability_disabled", "capability_removed", "consent_required"]);

  const $ = (id) => document.getElementById(id);
  const state = { mcp: null, tools: { github: new Set(), remote: new Set() } };

  async function use(name) {
    try { return window.claude?.use ? await window.claude.use(name) : null; } catch { return null; }
  }

  // The full-page state when GitHub can't be read: everything on the page hangs on it.
  function showConnector(code) {
    const [title, text] = {
      needs_reauth: ["Reconnect GitHub", "Your GitHub connector needs signing in again. Reconnect it in claude.ai Settings → Connectors, then refresh."],
      blocked_by_policy: ["GitHub is blocked", "Your organization's policy blocks the GitHub connector tools this page reads. Ask an admin to allow them."],
      not_in_manifest: ["Allow GitHub", "This page reads your specs and PRs through the GitHub connector, which isn't allowed for this page. Turn it on in Permissions."],
      approval_required: ["Allow GitHub", "This page reads your specs and PRs through the GitHub connector. Allow it in Permissions."],
    }[code] ?? ["Connect GitHub", "This page reads your specs and PRs through the GitHub connector. Add it in claude.ai Settings → Connectors, or allow it for this page in Permissions."];
    $("connector-title").textContent = title;
    $("connector-text").textContent = text;
    $("connector").hidden = false;
    $("app").hidden = true;
    $("status").textContent = "Not connected to GitHub";
  }

  $("permissions").addEventListener("click", async () => {
    const permissions = await use("permissions");
    $("permissions-hint").hidden = true;
    try {
      if (!permissions) throw new Error("unavailable");
      await permissions.manage();
      boot();
    } catch {
      $("permissions-hint").hidden = false;
    }
  });

  // Resolves null when GitHub is usable, else the code to explain.
  async function connect() {
    const mcp = await use("mcp");
    if (!mcp) return "server_not_connected";
    let listed;
    try { listed = await mcp.listTools(); } catch (e) { return e?.code ?? "server_not_connected"; }
    const find = (name) => listed.servers.find((s) => s.server.toLowerCase() === name.toLowerCase());
    for (const [key, c] of Object.entries(CONNECTORS)) {
      const entry = find(c.server);
      state.tools[key] = new Set(entry && entry.authStatus !== "needs_reauth" ? entry.tools.map((t) => t.name) : []);
    }
    if (find(CONNECTORS.github.server)?.authStatus === "needs_reauth") return "needs_reauth";
    if (!state.tools.github.has("list_issues") || !state.tools.github.has("list_pull_requests")) return "server_not_connected";
    state.mcp = mcp;
    return null;
  }

  // Per-viewer browser storage. It can throw or come back empty: the page works without it.
  const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(`ship-dashboard:${key}`)) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(`ship-dashboard:${key}`, JSON.stringify(value)); } catch {} },
  };

  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    }
    node.append(...kids.filter((k) => k != null));
    return node;
  };
  const note = (text, error = false) => { $("note").textContent = text; $("note").classList.toggle("error", error); };
  const splitRepo = (full) => { const [owner, repo] = full.split("/"); return { owner, repo }; };
  const codeOf = (e) => e?.code ?? "upstream_error";
  const since = (t) => (Date.now() - t < 60e3 ? "just now" : `${ago(Date.now() - t)} ago`);

  // ---- Projects: discovered (cached with its scan time) plus the ones added by name.

  const SCAN_LIMIT = 100;
  const projects = () => {
    const found = store.get("found", null)?.repos ?? [];
    const added = store.get("added", []);
    return [...new Set([...found, ...added])];
  };

  // true when the repo has docs/agents/shipping.md on its default branch (no ref reads that branch).
  async function hasShipping(full) {
    try {
      await state.mcp.callTool(CONNECTORS.github.server, "get_file_contents", { ...splitRepo(full), path: "docs/agents/shipping.md" });
      return true;
    } catch (e) {
      if (codeOf(e) === "tool_error") return false; // GitHub answered: no such file, or no such repo
      throw e;
    }
  }

  // Throws only when GitHub itself refuses (the caller shows the connector state).
  async function discover() {
    $("rescan").disabled = true;
    try {
      note("Looking for your repos…");
      let repos;
      try {
        const result = await state.mcp.callTool(CONNECTORS.remote.server, "list_repos", { limit: SCAN_LIMIT }, { cache: false });
        repos = (result.payload?.repos ?? []).map((r) => r.full_name).filter(Boolean).slice(0, SCAN_LIMIT);
      } catch (e) {
        return note(`Claude Code Remote couldn't list your repos (${codeOf(e)}). Add repos by name, or try Rescan.`, true);
      }
      const found = new Set();
      let done = 0;
      const queue = [...repos];
      const worker = async () => {
        for (let full; (full = queue.shift()); ) {
          try {
            if (await hasShipping(full)) found.add(full);
          } catch (e) {
            if (DENIED.has(codeOf(e))) throw e;
            // A transient failure on one repo: leave it out of this scan.
          }
          note(`Checking ${++done} of ${repos.length} repos for docs/agents/shipping.md…`);
        }
      };
      await Promise.all(Array.from({ length: 6 }, worker));
      const ordered = repos.filter((r) => found.has(r)); // most recently pushed first
      store.set("found", { repos: ordered, scannedAt: Date.now() });
      note(`Scanned your ${repos.length} most recently pushed repos just now: ${ordered.length} set up for ship.`);
    } finally {
      $("rescan").disabled = false;
    }
  }

  function scanNote() {
    const found = store.get("found", null);
    if (!canDiscover()) return note("Claude Code Remote isn't connected, so projects are added by name.");
    if (found?.scannedAt) note(`Last scanned ${since(found.scannedAt)}. Rescan to find repos newly set up for ship.`);
  }

  const canDiscover = () => state.tools.remote.has("list_repos") && state.tools.github.has("get_file_contents");

  $("rescan").addEventListener("click", async () => {
    try { await discover(); render(); } catch (e) { showConnector(codeOf(e)); }
  });

  $("addrepo").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = $("addrepo-name");
    const full = input.value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\.git$|\/$/g, "");
    if (!/^[\w.-]+\/[\w.-]+$/.test(full)) return note("Type the repo as owner/name, for example acme/app.", true);
    if (projects().some((p) => p.toLowerCase() === full.toLowerCase())) return note(`${full} is already on the dashboard.`);
    $("addrepo-go").disabled = true;
    note(`Checking ${full} for docs/agents/shipping.md…`);
    try {
      if (!(await hasShipping(full))) return note(`${full} isn't set up for ship: it has no docs/agents/shipping.md on its default branch, or GitHub can't find it. Run /ship:setup-ship in it first.`, true);
      store.set("added", [...store.get("added", []), full]);
      input.value = "";
      note(`Added ${full}.`);
      render();
    } catch (e) {
      if (DENIED.has(codeOf(e))) return showConnector(codeOf(e));
      note(`Couldn't check ${full} (${codeOf(e)}). Try again.`, true);
    } finally {
      $("addrepo-go").disabled = false;
    }
  });

  // ---- Loading: four watched reads per project, each project on its own.

  const REFETCH = 5 * 60e3;
  const DAY = 24 * 3600e3;
  const ISSUE_FIELDS = ["number", "title", "state", "labels", "created_at", "updated_at"];
  const PR_FIELDS = ["number", "title", "state", "draft", "merged", "merged_at", "html_url", "labels", "created_at", "updated_at"];
  const loads = new Map(); // "owner/name" -> { unsubs, parts, checks, error, storedAt }

  function readsFor(full) {
    const { owner, repo } = splitRepo(full);
    // Start of the UTC day a week and a day ago: a stable input, so the cache and the poll keep one identity all day.
    const closedSince = new Date(Math.floor(Date.now() / DAY) * DAY - 8 * DAY).toISOString();
    return {
      issuesOpen: ["list_issues", { owner, repo, state: "OPEN", perPage: 100, orderBy: "UPDATED_AT", direction: "DESC", fields: ISSUE_FIELDS }],
      issuesClosed: ["list_issues", { owner, repo, state: "CLOSED", since: closedSince, perPage: 50, orderBy: "UPDATED_AT", direction: "DESC", fields: ISSUE_FIELDS }],
      prsOpen: ["list_pull_requests", { owner, repo, state: "open", perPage: 100, sort: "updated", direction: "desc", fields: PR_FIELDS }],
      prsClosed: ["list_pull_requests", { owner, repo, state: "closed", perPage: 50, sort: "updated", direction: "desc", fields: PR_FIELDS }],
    };
  }
  const listOf = (payload, key) => (Array.isArray(payload) ? payload : Array.isArray(payload?.[key]) ? payload[key] : []);

  function watchProject(full) {
    loads.get(full)?.unsubs.forEach((u) => u());
    const load = { unsubs: [], parts: {}, checks: {}, error: null, storedAt: null };
    loads.set(full, load);
    for (const [part, [tool, input]] of Object.entries(readsFor(full))) {
      const unsub = state.mcp.watchTool(CONNECTORS.github.server, tool, input, (ev) => {
        if (loads.get(full) !== load) return;
        if (ev.type === "error") return onError(full, load, part, ev.error);
        load.parts[part] = listOf(ev.result.payload, part.startsWith("issues") ? "issues" : "pull_requests");
        load.error = null;
        load.storedAt = Math.max(load.storedAt ?? 0, ev.result.cache?.storedAt ?? Date.now());
        if (part === "prsOpen") readChecks(full, load);
        renderAll();
      }, { refetchInterval: REFETCH });
      load.unsubs.push(unsub);
    }
  }

  function onError(full, load, part, error) {
    const code = codeOf(error);
    // GitHub refused outright: the whole page hangs on it, so say so once, page-wide.
    if (DENIED.has(code)) { stopAll(); return showConnector(code); }
    // Anything else: this project shows an error row, and keeps cards it already has.
    load.error = { part, code, message: error?.message ?? "" };
    renderAll();
  }

  // Checks for each ready open PR (drafts are still being built). One-shot reads, cached a few minutes:
  // a watch per PR would run past the page's limit of 64 watches.
  async function readChecks(full, load, refresh = false) {
    if (!state.tools.github.has("pull_request_read")) return;
    const { owner, repo } = splitRepo(full);
    const ready = (load.parts.prsOpen ?? []).filter((p) => !p.draft);
    const cache = { staleTime: 4 * 60e3, gcTime: 10 * 60e3, ...(refresh ? { refresh: true } : {}) };
    const read = (method, pullNumber) => state.mcp
      .callTool(CONNECTORS.github.server, "pull_request_read", { method, owner, repo, pullNumber }, { cache })
      .then((r) => r.payload, () => null); // unreadable checks count as none failing
    await Promise.all(ready.map(async (p) => {
      const [runs, status] = await Promise.all([read("get_check_runs", p.number), read("get_status", p.number)]);
      load.checks[p.number] = { check_runs: runs?.check_runs ?? [], statuses: status?.statuses ?? [] };
    }));
    if (loads.get(full) === load) renderAll();
  }

  const loaded = (load) => load && ["issuesOpen", "issuesClosed", "prsOpen", "prsClosed"].every((k) => load.parts[k]);

  function cardsOf(full) {
    const load = loads.get(full);
    if (!loaded(load)) return [];
    const { issuesOpen, issuesClosed, prsOpen, prsClosed } = load.parts;
    return toCards(full, [...issuesOpen, ...issuesClosed], [...prsOpen, ...prsClosed], load.checks, Date.now());
  }

  function stopAll() {
    for (const load of loads.values()) load.unsubs.forEach((u) => u());
    loads.clear();
  }

  // Start watching new projects, stop watching ones no longer listed.
  function syncWatches() {
    const list = projects();
    for (const full of [...loads.keys()]) if (!list.includes(full)) { loads.get(full).unsubs.forEach((u) => u()); loads.delete(full); }
    for (const full of list) if (!loads.has(full)) watchProject(full);
  }

  async function refresh() {
    if (!state.mcp) return boot();
    try { await state.mcp.invalidate(CONNECTORS.github.server); } catch { stopAll(); syncWatches(); }
    for (const [full, load] of loads) readChecks(full, load, true);
  }

  // ---- Rendering

  const BUCKET_TOKEN = { "needs-you": "needs", ready: "ready", "in-flight": "flight", landed: "landed" };
  const KIND_LABEL = { spec: "Spec", design: "Design", pr: "PR" };

  // One card. Sibling specs extend the dashboard here: details, actions and sessions hang off the card.
  function renderCard(card) {
    return el("article", { class: `card b-${BUCKET_TOKEN[card.bucket]}`, "data-project": card.project, "data-kind": card.kind },
      el("div", { class: "card-meta" },
        el("span", { class: "card-project mono", text: card.project }),
        el("span", { class: "card-kind", text: KIND_LABEL[card.kind] }),
      ),
      el("a", { class: "card-title", href: card.url, target: "_blank", rel: "noopener", title: `#${card.number} ${card.title}` },
        el("span", { class: "card-num mono", text: `#${card.number}` }), " ", card.title),
      el("div", { class: "card-foot" },
        el("span", { class: "card-reason", text: card.reason }),
        el("time", { class: "card-age mono", datetime: card.since, title: new Date(card.since).toLocaleString(), text: card.age }),
      ),
    );
  }

  function countPills(counts) {
    return BUCKETS.map((b) => el("span", { class: `pill b-${BUCKET_TOKEN[b.id]}${counts[b.id] ? "" : " zero"}`, title: b.title },
      el("span", { class: "pill-n mono", text: String(counts[b.id]) }), el("span", { class: "pill-label", text: b.title })));
  }

  function projectRow(full) {
    const load = loads.get(full);
    const name = el("div", { class: "name" }, el("a", { href: `https://github.com/${full}`, target: "_blank", rel: "noopener", text: full }));
    const updated = load?.storedAt ? `updated ${since(load.storedAt)}` : "";
    if (load?.error && !loaded(load)) {
      const retry = el("button", { class: "btn small", type: "button", text: "Retry" });
      retry.addEventListener("click", () => { watchProject(full); renderAll(); });
      return el("div", { class: "project is-error", "data-project": full }, name,
        el("div", { class: "row-error", text: `Couldn't load: ${load.error.message || load.error.code}` }), retry);
    }
    if (!loaded(load)) {
      return el("div", { class: "project is-loading", "data-project": full, "aria-busy": "true" }, name,
        el("div", { class: "skeleton", "aria-label": "Loading" }, el("span"), el("span"), el("span"), el("span")),
        el("div", { class: "updated", text: "loading…" }));
    }
    const stale = load.error ? el("span", { class: "row-stale", text: ` · refresh failed (${load.error.code})` }) : null;
    return el("div", { class: "project", "data-project": full }, name,
      el("div", { class: "counts" }, ...countPills(counts(cardsOf(full)))),
      el("div", { class: "updated" }, updated, stale));
  }

  // Within a bucket: what has waited longest first; Landed shows the newest first.
  const order = (bucket) => (a, b) => (bucket === "landed" ? -1 : 1) * (Date.parse(a.since) - Date.parse(b.since));

  function renderBoard(cards, stillLoading) {
    const board = el("section", { class: "board", "aria-label": "Buckets" });
    for (const b of BUCKETS) {
      const mine = cards.filter((c) => c.bucket === b.id).sort(order(b.id));
      const empty = el("p", { class: "col-empty", text: stillLoading ? "Loading…" : b.empty });
      board.append(el("section", { class: `col b-${BUCKET_TOKEN[b.id]}`, "data-bucket": b.id, "aria-label": b.title },
        el("h2", {}, el("span", { class: "dot", "aria-hidden": "true" }), b.title, el("span", { class: "col-n mono", text: String(mine.length) })),
        mine.length ? el("div", { class: "cards" }, ...mine.map(renderCard)) : empty));
    }
    return board;
  }

  // ---- Phone: projects become filter chips, buckets become tabs. Remembered per viewer.

  const phone = window.matchMedia("(max-width: 720px)");
  phone.addEventListener?.("change", () => { if (state.mcp) renderAll(); });
  const view = { tab: "needs-you", project: "all", ...store.get("view", {}) };
  const setView = (patch) => { Object.assign(view, patch); store.set("view", view); renderAll(); };

  function renderChips(list) {
    const chip = (value, label, extra) => {
      const b = el("button", { class: "chip", type: "button", "aria-pressed": String(view.project === value) }, label, extra);
      b.addEventListener("click", () => setView({ project: value }));
      return b;
    };
    return [chip("all", "All"), ...list.map((full) => {
      const load = loads.get(full);
      const mark = load?.error && !loaded(load) ? el("span", { class: "chip-flag", text: "failed" })
        : !loaded(load) ? el("span", { class: "chip-flag", text: "loading" })
        : el("span", { class: "chip-n mono", text: String(counts(cardsOf(full))["needs-you"] || "") });
      const short = full.split("/")[1];
      const clash = list.filter((other) => other.split("/")[1] === short).length > 1;
      return chip(full, clash ? full : short, mark);
    })];
  }

  function renderTabs(tally) {
    return BUCKETS.map((b) => {
      const t = el("button", { class: `tab b-${BUCKET_TOKEN[b.id]}`, type: "button", role: "tab", id: `tab-${b.id}`, "aria-selected": String(view.tab === b.id), "aria-controls": "board" },
        b.title, " ", el("span", { class: "tab-n mono", text: String(tally[b.id]) }));
      t.addEventListener("click", () => setView({ tab: b.id }));
      return t;
    });
  }

  function renderAll() {
    const list = projects();
    const box = $("projects");
    box.replaceChildren(el("h2", { text: "Projects" }));
    if (!list.length) {
      box.append(el("p", { class: "empty" }, "No repo set up for ship yet: run ", el("code", { text: "/ship:setup-ship" }), " in one."));
      box.classList.remove("phone-hide");
      for (const id of ["board", "chips", "tabs"]) $(id).replaceChildren();
      return;
    }
    if (view.project !== "all" && !list.includes(view.project)) view.project = "all";
    const narrow = phone.matches;
    // On a phone the chip filters what shows; desktop always shows every project.
    const shownProjects = narrow && view.project !== "all" ? [view.project] : list;
    const rows = list.map(projectRow);
    rows.forEach((row) => row.classList.toggle("phone-hide", !(row.classList.contains("is-error") && shownProjects.includes(row.dataset.project))));
    box.append(...rows);
    box.classList.toggle("phone-hide", rows.every((r) => r.classList.contains("phone-hide")));
    const cards = shownProjects.flatMap(cardsOf);
    const stillLoading = shownProjects.some((full) => !loaded(loads.get(full)) && !loads.get(full)?.error);
    const board = renderBoard(cards, stillLoading);
    board.dataset.tab = view.tab;
    board.setAttribute("aria-labelledby", `tab-${view.tab}`);
    $("board").replaceChildren(board);
    $("chips").replaceChildren(...renderChips(list));
    $("tabs").replaceChildren(...renderTabs(counts(cards)));
    const newest = Math.max(0, ...list.map((full) => loads.get(full)?.storedAt ?? 0));
    $("status").textContent = `${list.length} ${list.length === 1 ? "project" : "projects"}` + (newest ? ` · updated ${since(newest)}` : "");
  }

  function render() {
    syncWatches();
    renderAll();
  }

  async function boot() {
    stopAll();
    const problem = await connect();
    if (problem) return showConnector(problem);
    $("connector").hidden = true;
    $("app").hidden = false;
    $("rescan").hidden = !canDiscover();
    render();
    if (canDiscover() && !store.get("found", null)) {
      try { await discover(); } catch (e) { stopAll(); return showConnector(codeOf(e)); }
      render();
    } else {
      scanNote();
    }
  }

  $("refresh").addEventListener("click", () => refresh());
  setInterval(() => { if (state.mcp && !$("app").hidden) renderAll(); }, 60e3); // ages and "updated" times move on
  boot();
})();
</script>
