# Installed by /ship:setup-ship. The rules it enforces are in docs/agents/shipping.md.
#
# A PR reaches __DEFAULT_BRANCH__ only once a person has reviewed it and added the `ship` label:
# - `gate` sets the required `ship` commit status: pending until labelled, success after.
# - `automerge` turns on GitHub auto-merge for a labelled PR, so it merges when CI is green.
# - `dependabot` labels low-risk dependency PRs itself.
# - `land` (command mode only) runs the project's own landing command on the labelled PRs.
#
# SHIP_TOKEN is a fine-grained token (contents, pull requests: read and write). Merges, labels
# and PRs made with the default GITHUB_TOKEN don't trigger other workflows (CI, deploys),
# so every write that must trigger one uses it.
name: Ship

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
# >>> command mode
  schedule:
    - cron: "__LAND_CRON__"
  workflow_dispatch:
# <<< command mode

env:
  SHIP_LABEL: ship
  MERGE_METHOD: __MERGE_METHOD__
# >>> command mode
  LAND_BRANCH_PREFIX: "__LAND_BRANCH_PREFIX__"
# <<< command mode

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set the ship status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          state=pending; desc="Waiting for review: add the '$SHIP_LABEL' label to ship it"
          if echo "$LABELS" | jq -e --arg l "$SHIP_LABEL" 'index($l) != null' >/dev/null; then
            state=success; desc="Reviewed"
          fi
# >>> command mode
          case "$HEAD" in "$LAND_BRANCH_PREFIX"*) state=success; desc="Batch of reviewed PRs";; esac
# <<< command mode
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=ship -f description="$desc" >/dev/null
          echo "ship: $state ($desc)"

  automerge:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      __AUTOMERGE_CONDITION__
    runs-on: ubuntu-latest
    steps:
      - name: Merge when green
        env:
          GH_TOKEN: ${{ secrets.SHIP_TOKEN || github.token }}
          HAS_SHIP_TOKEN: ${{ secrets.SHIP_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ "$HAS_SHIP_TOKEN" = true ] || echo "::warning::No SHIP_TOKEN secret: the merge won't trigger workflows on __DEFAULT_BRANCH__ (deploys)."
          gh pr merge "$PR" --auto "--$MERGE_METHOD" --repo "$GITHUB_REPOSITORY"

  dependabot:
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Ship patch and GitHub Actions updates without review
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.SHIP_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::Add SHIP_TOKEN as a Dependabot secret too; skipping the label."; exit 0; }
          gh pr edit "$PR" --add-label "$SHIP_LABEL" --repo "$GITHUB_REPOSITORY"
# >>> command mode

  land:
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ship')
    runs-on: ubuntu-latest
    concurrency: { group: ship-land, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.SHIP_TOKEN }}" }
__SETUP_STEPS__
      - name: Land the reviewed, green PRs
        env:
          GH_TOKEN: ${{ secrets.SHIP_TOKEN }}
        run: |
          git config user.name "ship" && git config user.email "__COMMIT_EMAIL__"
          # shellcheck disable=SC2016 # a jq program, not shell
          prs=$(gh pr list --label "$SHIP_LABEL" --state open --json number,isDraft,headRefName,statusCheckRollup --jq '
            [.[] | select(.isDraft | not) | select(.headRefName | startswith(env.LAND_BRANCH_PREFIX) | not)
                 | select(all(.statusCheckRollup[]; (.conclusion // .state) as $s | $s == "SUCCESS" or $s == "SKIPPED" or $s == "NEUTRAL"))
                 | .number] | map(tostring) | join(" ")')
          [ -n "$prs" ] || { echo "Nothing to land."; exit 0; }
          echo "Landing: $prs"
          # shellcheck disable=SC2086 # one argument per PR number
          __LAND_COMMAND__ $prs
# <<< command mode
